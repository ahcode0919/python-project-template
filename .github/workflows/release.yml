name: Release

# Publishes a template release. Copier reads the resulting vX.Y.Z tags as template versions.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
    - name: Refresh draft release
      id: drafter
      uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Publishing the draft creates the vX.Y.Z tag at the commit this workflow ran on
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.drafter.outputs.id }}
      run: |
        gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
          -F draft=false -f target_commitish="$GITHUB_SHA"
