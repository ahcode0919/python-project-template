name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ">=0.11,<0.12"

    - name: Refresh draft release
      id: drafter
      uses: release-drafter/release-drafter@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Bump version
      env:
        VERSION: ${{ steps.drafter.outputs.resolved_version }}
      run: uv version "$VERSION"

    - name: Update CHANGELOG.md
      uses: stefanzweifel/changelog-updater-action@v1
      with:
        latest-version: ${{ steps.drafter.outputs.tag_name }}
        release-notes: ${{ steps.drafter.outputs.body }}

    - name: Commit and push
      id: commit
      env:
        TAG: ${{ steps.drafter.outputs.tag_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml uv.lock CHANGELOG.md
        git commit -m "Release $TAG"
        git push origin main
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.drafter.outputs.id }}
        SHA: ${{ steps.commit.outputs.sha }}
      run: |
        gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
          -F draft=false -f target_commitish="$SHA"

    - name: Build and upload artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.drafter.outputs.tag_name }}
      run: |
        uv build
        gh release upload "$TAG" dist/*
