name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
        version: ">=0.13,<0.14"

    - name: Refresh draft release
      id: drafter
      uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Bump version
      env:
        VERSION: ${{ steps.drafter.outputs.resolved_version }}
      run: uv version "$VERSION"

    - name: Update CHANGELOG.md
      uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
      with:
        latest-version: ${{ steps.drafter.outputs.tag_name }}
        release-notes: ${{ steps.drafter.outputs.body }}

    - name: Commit and push
      id: commit
      env:
        TAG: ${{ steps.drafter.outputs.tag_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml uv.lock CHANGELOG.md
        git commit -m "Release $TAG"
        git push origin main
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.drafter.outputs.id }}
        SHA: ${{ steps.commit.outputs.sha }}
      run: |
        gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
          -F draft=false -f target_commitish="$SHA"

    - name: Build and upload artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.drafter.outputs.tag_name }}
      run: |
        uv build
        gh release upload "$TAG" dist/*
