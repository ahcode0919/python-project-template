name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  code-check-and-unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup just
      uses: extractions/setup-just@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: ">=0.11,<0.12"
    - name: Check gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: false
    - name: Setup environment
      run: |
        just sync
    - name: Lint
      run: |
        just ci-lint
    - name: Unit tests
      run: |
        just test
