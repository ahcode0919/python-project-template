name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-check-and-unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup just
      uses: extractions/setup-just@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - name: Setup environment
      run: |
        just sync
    - name: Lint
      run: |
        just ci-lint
    - name: Unit tests
      run: |
        just test
