# Release Drafter configuration.
# See https://github.com/release-drafter/release-drafter for more information.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
category-template: '### $TITLE'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&@'
exclude-labels:
  - 'skip-changelog'
categories:
  - title: 'Breaking Changes'
    labels: ['breaking']
  - title: 'Features'
    labels: ['feature', 'enhancement']
  - title: 'Bug Fixes'
    labels: ['bug', 'fix']
  - title: 'Maintenance'
    labels: ['chore', 'ci', 'dependencies', 'documentation', 'refactor']
version-resolver:
  major:
    labels: ['breaking']
  minor:
    labels: ['feature', 'enhancement']
  patch:
    labels: ['bug', 'fix', 'chore', 'ci', 'dependencies', 'documentation', 'refactor']
  default: patch
autolabeler:
  - label: 'feature'
    branch: ['/^feat(ure)?\/.+/']
  - label: 'bug'
    branch: ['/^(bug)?fix\/.+/']
  - label: 'chore'
    branch: ['/^chore\/.+/']
  - label: 'ci'
    branch: ['/^ci\/.+/']
    files: ['.github/workflows/*']
  - label: 'documentation'
    branch: ['/^docs?\/.+/']
    files: ['*.md']
  - label: 'refactor'
    branch: ['/^refactor\/.+/']
  - label: 'dependencies'
    files: ['uv.lock']
template: |
  $CHANGES
