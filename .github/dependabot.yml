# Dependabot configuration for the template repository.
# See https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Python dependencies are not listed: template/pyproject.toml.jinja is a Copier template that
# Dependabot can't parse. New projects resolve the latest versions with `uv lock`, and generated
# projects get their own uv Dependabot entry from template/.github/dependabot.yml.
version: 2

updates:
  # GitHub Actions used by the template repo and by generated projects
  - package-ecosystem: "github-actions"
    directories: ["/", "/template"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # Base image in template/.devcontainer/Dockerfile
  - package-ecosystem: "docker"
    directory: "/template/.devcontainer"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]

  # Features in template/.devcontainer/devcontainer.json
  - package-ecosystem: "devcontainers"
    directory: "/template"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
