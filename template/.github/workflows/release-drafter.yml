name: Release Drafter

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read

jobs:
  update-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
    - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  autolabel:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
    - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
      with:
        disable-releaser: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  require-label:
    needs: [ autolabel ]
    # Run even when autolabel is skipped (labeled/unlabeled events)
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
    - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
      with:
        mode: minimum
        count: 1
        labels: "breaking, feature, enhancement, bug, fix, chore, ci, dependencies, documentation, refactor, skip-changelog"
        use_api: true
