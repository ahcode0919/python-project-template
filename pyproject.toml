[project]
name = "example"
description = "example"
version = "0.0.1"
requires-python = ">=3.14"

dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "prek>=0.5.10",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.0",
    "ty>=0.0.96",
]

[tool.codespell]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under 98"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I", "N", "PT", "D", "UP", "RUF", "SIM"]  # Choose your rule categories
ignore = ["D100", "D104", "D211", "D203", "D213", "D400", "D401", "D415"]
extend-ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # Ignore docstring (D) errors in tests

[tool.ruff.format]
quote-style = "double"

[tool.uv]
required-version = ">=0.13,<0.14"
